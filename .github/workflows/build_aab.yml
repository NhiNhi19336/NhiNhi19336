Xem tệp .github/workflows/build_aab.yml
Quá trình thất bại xảy ra trong bước thiết lập Android SDK, chứ không phải trong quá trình xây dựng tệp AAB thực tế.

Theo quy trình làm việc trong tệp .github/workflows/build_aab.yml, bước bị lỗi là:

Thiết lập Android SDK
sử dụng: android-actions/setup-android@v3
Nhật ký hiển thị:

Cảnh báo: Không tìm thấy gói 'tools'
Lỗi: Tiến trình '/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager' thất bại với mã thoát 1.
Điều đó có nghĩa là GitHub Action đã cố gắng cài đặt hoặc cập nhật các gói Android SDK, nhưng toolskhông tìm thấy/không thể giải quyết được gói cần thiết có tên cụ thể. Kết quả là, môi trường SDK không được thiết lập đúng cách và tác vụ đã dừng sớm với mã lỗi 1 trước khi quá trình xây dựng ứng dụng có thể tiếp tục.

Vậy nguyên nhân gốc rễ là do bước cài đặ
