name: 2. Xuat File AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build AAB
        run: ./gradlew bundleRelease
        env:
          MY_KEYSTORE_FILE: release-key.jks
          MY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
